[platformio]
default_envs = esp32dev
src_dir = main
description = Civic-Workbench firmware baseline for ESP32S NodeMCU / NodeMCU-32S + TWAI

[env:esp32dev]
platform = espressif32@6.9.0
board = nodemcu-32s
framework = espidf
monitor_speed = 115200
; Board profile matches the owner's specified NodeMCU-32S (classic ESP32, 4 MB profile).
; Runtime hardware initialization, bitrate authorization and physical TX remain disabled.
; Do not flash until physical board revision, GPIO continuity, circuit and bitrate are reviewed.
