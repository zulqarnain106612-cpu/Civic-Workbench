[platformio]
default_envs = esp32dev
src_dir = main
description = Civic-Workbench firmware baseline for original ESP32 + TWAI

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = espidf
monitor_speed = 115200
; Generic ESP32 dev-module build target is used only as a compile target.
; Do not flash hardware until the exact module, GPIOs, wiring, interlock and bitrate are verified.
