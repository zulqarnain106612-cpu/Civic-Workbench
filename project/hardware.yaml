schema_version: 1
baseline:
  mcu: "ESP32S NodeMCU / NodeMCU-32S (original ESP32 with integrated TWAI controller)"
  board_id: "nodemcu-32s"
  platformio_environment: "esp32dev (legacy environment name; exact board target nodemcu-32s)"
  board_note: "Exact target specified by the owner; not an ESP32-S2/S3/C3 and not a substitute board."
  can_transceiver:
    part: "NXP TJA1051"
    package: "SO8, as recorded in project; verify physical package/orientation before wiring"
    reported_top_marking: "NXP TJA1051 25 06 ND312"
    marking_note: "The exact physical component is NXP TJA1051 marked NXP TJA1051 25 06 ND312. No substitute is permitted. Do not infer an orderable suffix from the visible marking."
    substitutions_allowed: false
    official_datasheet: "https://www.nxp.com/docs/en/data-sheet/TJA1051.pdf"
  controller_reference: "https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-reference/peripherals/twai.html"
electrical_reference_from_datasheet:
  vcc:
    pin: 3
    required_range_v: [4.5, 5.5]
  pin5_variant_dependent:
    pin: 5
    role: "Variant-dependent (n.c., VIO or EN). Not inferred from the marking; owner-supplied datasheet pages show the n.c. type. Unconfirmed for the installed IC."
    connection_state: "LEFT OPEN. Electrically fail-safe for n.c., VIO and EN variants (AH1014 Table 21); Rev B receives only if pin 5 is n.c., so the function must be confirmed on the bench"
  gnd: {pin: 2, role: "Common logic/transceiver ground"}
  txd: {pin: 1, role: "Transmit data input, VIH >= 0.7 VCC (3.5 V); Rev B: not driven by ESP32, held recessive by R2 10k to +5V_CAN"}
  rxd: {pin: 4, role: "Receive data output at VCC (5 V) logic; Rev B: via R3 12k / R4 20k divider to ESP32 GPIO22"}
  canl: {pin: 6, role: "CAN bus low"}
  canh: {pin: 7, role: "CAN bus high"}
  s:
    pin: 8
    role: "Transceiver operating mode control"
    normal_mode: "LOW; permits transmit and receive"
    silent_mode: "HIGH; disables transmitter while receiver remains active"
    default: "HIGH via R1 10k to +5V_CAN (Rev B); never driven by the ESP32"
pin_mapping:
  board_pinout_source: "PlatformIO nodemcu-32s board target plus Espressif classic-ESP32 GPIO documentation"
  twai_tx_gpio: 21
  mapping_to_transceiver: "ESP32 GPIO21/TWAI_TX is reserved but NOT wired in Rev B (receive-only); 3.3 V cannot meet TXD VIH"
  twai_rx_gpio: 22
  mapping_from_transceiver: "TJA1051 pin 4 RXD -> R3/R4 divider -> ESP32 GPIO22/TWAI_RX (header pin 36)"
  reserved_functions: "GPIO21/22 reserved by this design for TWAI; do not reuse them for I2C."
  pinout_verification_state: "Source-mapped; physical header continuity and PCB revision have not been measured."
  s_control: "Receive-only: pin 8 S held HIGH by R1 to +5V_CAN; no MCU control. TX hardware-impossible in Rev B."
  bus_connection: "Provide accessible CANH, CANL, signal ground, and an explicitly documented connector/pinout."
design_requirements:
  - "Never connect CANH/CANL directly to ESP32 GPIO."
  - "Do not power TJA1051 VCC from the ESP32 3.3 V rail; respect the datasheet VCC range."
  - "Do not wire variant-dependent pin 5 from a family-name assumption; use manufacturer evidence for the exact marked item before any connection or power-up."
  - "Add local supply decoupling close to the IC and document component values and placement rationale."
  - "Include protection, connector labeling, test points, and termination strategy based on intended bus topology."
  - "Do not blindly add 120-ohm termination to an existing vehicle network; termination is a bus-topology property."
  - "Provide power/reset-safe state and a hardware-enforced TX inhibit, not only a UI checkbox."
  - "Verify GPIO boot-strapping constraints and avoid pins whose boot behavior can unintentionally enable transmit."
  - "Use only the specified physical NXP TJA1051 marked NXP TJA1051 25 06 ND312; do not substitute a different transceiver or development-board circuit."
open_items:
  - "On the physical NodeMCU-32S, verify board silkscreen/revision and continuity of GPIO21/GPIO22 headers before wiring."
  - "Preserve the exact marking NXP TJA1051 25 06 ND312 and do not substitute another part. Confirm physical SO8 pin-1 orientation before wiring. Pin 5 stays open (fail-safe)."
  - "Before connecting GPIO22, power U1 alone and measure RXD_3V3 <= 3.6 V and S >= 3.5 V."
  - "Receive-only component values are defined in hardware/reference/esp32-tja1051-netlist.yaml (Rev B) and checked by design-checks.json; bench measurement still pending."
  - "Select connector, supply protection, and termination/jumper policy from the actual intended bus topology; no default vehicle termination."
  - "Do not enable firmware hardware initialization until the controlled bench supply, transceiver wiring, and independently evidenced bitrate are reviewed."
