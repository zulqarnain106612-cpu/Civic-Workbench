    - tests/firmware/test_safety_policy.c
    - tests/test_firmware_source.py
    - tests/test_firmware_can_core.py::FirmwareCanCoreMockTests.test_production_can_core_with_mock_twai_and_freertos
    - tests/test_firmware_source.py::FirmwareSourceGuardTests.test_default_mode_is_passive_and_tx_uses_one_guarded_api
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    status: simulation-TX-audit-verified;physical-TX-disabled
    limitation: Repeats/cancel/audit and denial of hardware-target requests are tested.
      Physical host-to-firmware TX and vehicle safety operation remain disabled/unverified.
  REQ-REV-001:
    implementation:
    - schemas/v1/analysis-finding.schema.json
    - src/civic_workbench/analysis.py
    - src/civic_workbench/diagnostics.py
    - schemas/v1/parameter-mapping.schema.json
    - src/civic_workbench/storage.py
    tests:
    - tests/test_contracts.py::SessionAndFindingContractTests
    - tests/test_analysis.py
    - tests/test_storage_and_import_export.py
    - tests/test_api_integration.py
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S06-analysis-report.md
    status: host-analysis-verified;vehicle-mapping-validation-pending
    limitation: Evidence-linked analysis and versioned explicit decoders pass tests.
      Honda-specific mappings/scales remain unknown until independently verified.
  REQ-DATA-001:
    implementation:
    - schemas/v1/capture-session.schema.json
    - schemas/v1/can-frame.schema.json
    - src/civic_workbench/storage.py
    - src/civic_workbench/service.py
    - src/civic_workbench/app.py
    tests:
    - tests/test_contracts.py::JsonSchemaTests
    - tests/test_storage_and_import_export.py
    - tests/test_api_integration.py
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S05-storage-report.md
    status: host-persistence-and-round-trip-verified
    limitation: SQLite/raw JSONL durability, hashes, pagination, bundle import/export
      and rollback tests pass. Imported data authenticity and storage hardware fault
      certification are not claimed.
  REQ-UI-001:
    implementation:
    - src/civic_workbench/web/index.html
    - src/civic_workbench/web/app.js
    - src/civic_workbench/web/styles.css
    - src/civic_workbench/app.py
