    - docs/reports/S05-storage-report.md
    - docs/reports/S06-analysis-report.md
    - docs/reports/S07-tx-diagnostics-report.md
    - docs/reports/S08-simulator-report.md
    - docs/reports/S09-proteus-generator-report.md
    - docs/reports/S10-integration-report.md
    - docs/reports/S11-hardening-performance-report.md
    - docs/reports/S12-final-handoff-report.md
    tests:
    - tests/test_contracts.py::ApiAndTraceabilityTests::test_requirement_traceability_covers_all_declared_requirements
    - tests/test_contracts.py::ApiAndTraceabilityTests.test_requirement_traceability_covers_all_declared_requirements
    - tests/test_contracts.py::ApiAndTraceabilityTests.test_progress_ledger_records_verified_stage_state
    - tests/test_packaging.py
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    - docs/reports/S12-final-handoff-report.md
    status: repository-evidence-index-and-stage-ledger-verified;physical-evidence-pending
    limitation: The stage ledger, reports and traceability link the host/test/build
      evidence. Physical bench/vehicle and native Proteus evidence are absent by design.
  REQ-QUAL-001:
    implementation:
    - requirements.txt
    - requirements-dev.txt
    - Makefile
    - tests/test_contracts.py
    - firmware/esp32/platformio.ini
    - firmware/esp32/sdkconfig.defaults
    - tools/requirements-platformio.txt
    - tests/test_firmware_source.py
    - tests/firmware/test_safety_policy.c
    - firmware/esp32/main/
    - tests/test_firmware_can_core.py
    - tests/test_firmware_serial_transport.py
    - tests/test_firmware_transport.py
    - pyproject.toml
    - scripts/run-local.sh
    - .github/workflows/ci.yml
    - tools/benchmark.py
    - docs/fault-matrix.md
    - docs/security-review.md
    - tools/check_schema_sync.py
    - tools/check_built_wheel.py
    tests:
    - PYTHONPATH=src python3 -m unittest discover -s tests -v
    - git diff --check
    - make test
    - python3 -m compileall -q src tests
    - cd firmware/esp32 && ~/.venvs/civic-workbench-pio/bin/pio run
    - make verify
    - make firmware-build
    - tests/test_api_security.py
    - tests/test_storage_and_import_export.py
    - tests/test_simulator_tx.py
    - tests/test_proteus_generator.py
    - tests/test_api_integration.py
    - tests/test_packaging.py
    evidence:
    - docs/reports/S01-contract-report.md
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    - docs/reports/S11-hardening-performance-report.md
    - docs/reports/S11-benchmark-results.json
    - docs/reports/S12-final-handoff-report.md
    status: make-verify-passed;synthetic-benchmark-and-ESP32-compile-passed
    limitation: The Python test suite (115 tests at S15), native C safety, schemas, YAML, package contents,
      deterministic design sources, synthetic benchmark and firmware compile pass.
      No external penetration test or real-bus performance guarantee is claimed.
  REQ-TOK-001:
    implementation:
    - CLAUDE.md
    - docs/staged-delivery.md
    - project/dependencies.yaml
    - project/stages.yaml
    - project/progress.json
    - docs/evidence-index.md
    tests:
    - tests/test_contracts.py::ApiAndTraceabilityTests
    - tests/test_packaging.py
    - tests/test_contracts.py::ApiAndTraceabilityTests.test_stage_dependency_graph_is_complete_and_acyclic
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S01-contract-report.md
    - docs/reports/S12-final-handoff-report.md
    status: agent-contract-delivered;token-savings-not-measured
    limitation: The concise stage/dependency/evidence map is in place. Agent token/cost
      savings are not quantified because no controlled before/after measurement was
      performed.
rules:
- Use repository-relative paths and stable test identifiers for every implementation/evidence
  reference.
- Set status to verified only when evidence exists and the full requirement acceptance
  criteria pass.
- Partial means a specific subset is implemented and tested; it does not mean the
  requirement is complete.
- Simulation evidence must not be labeled hardware_bench or vehicle evidence.
- Any exception requires a reason, risk, approving person, and expiry/revisit condition.
