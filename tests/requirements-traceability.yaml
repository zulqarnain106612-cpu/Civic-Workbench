schema_version: 1
verification_levels:
  unit: "Module-local deterministic automated test"
  contract: "Versioned interface/schema compatibility test"
  integration: "Multiple real modules connected in a controlled test"
  simulation: "Deterministic virtual CAN scenario; never physical-vehicle evidence"
  hardware_bench: "Test with the target board/transceiver on an isolated electrical setup"
  vehicle: "Deliberate on-vehicle procedure with recorded setup and outcome"
requirements:
  REQ-ARCH-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-HW-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-CAN-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-CAN-002: {implementation: null, tests: [], evidence: [], status: open}
  REQ-CAN-003: {implementation: null, tests: [], evidence: [], status: open}
  REQ-REV-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-DATA-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-UI-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-SIM-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-DIAG-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-PROT-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-SAFE-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-EVID-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-QUAL-001: {implementation: null, tests: [], evidence: [], status: open}
  REQ-TOK-001: {implementation: "CLAUDE.md; docs/staged-delivery.md", tests: [], evidence: ["Specification baseline"], status: partial}
rules:
  - "Use repository-relative paths and stable test identifiers for every implementation/evidence reference."
  - "Set status to verified only when evidence exists and the test result is recorded."
  - "Simulation evidence must not be labeled hardware_bench or vehicle evidence."
  - "Any exception requires a reason, risk, approving person, and expiry/revisit condition."
