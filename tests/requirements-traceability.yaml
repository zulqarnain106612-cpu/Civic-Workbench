  REQ-SAFE-001:
    implementation:
    - schemas/v1/safety-state.schema.json
    - src/civic_workbench/contracts.py::authorize_transmission
    - firmware/esp32/main/civic_safety.c
    - firmware/esp32/main/civic_safety_policy.c
    - hardware/reference/safety-interlock.md
    - firmware/esp32/main/civic_can.c
    tests:
    - tests/test_contracts.py::DiagnosticAndSafetyContractTests
    - tests/firmware/test_safety_policy.c
    - tests/test_firmware_source.py
    - tests/test_firmware_can_core.py
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    - hardware/reference/safety-interlock.md
    status: host-safety-tests-passed;physical-interlock-validation-pending
