schema_version: 1
verification_levels:
  unit: Module-local deterministic automated test
  contract: Versioned interface/schema compatibility test
  integration: Multiple real modules connected in a controlled test
  simulation: Deterministic virtual CAN scenario; never physical-vehicle evidence
  hardware_bench: Test with the target board/transceiver on an isolated electrical
    setup
  vehicle: Deliberate on-vehicle procedure with recorded setup and outcome
requirements:
  REQ-ARCH-001:
    implementation:
    - schemas/v1/
    - contracts/openapi.yaml
    - src/civic_workbench/contracts.py
    - firmware/esp32/main/
    - firmware/esp32/platformio.ini
    - firmware/esp32/main/civic_can.c
    - firmware/esp32/main/civic_transport.c
    - firmware/esp32/main/civic_transport_format.c
    tests:
    - tests/test_contracts.py::JsonSchemaTests
    - tests/test_contracts.py::ApiAndTraceabilityTests
    - tests/test_firmware_source.py
    - PlatformIO original-ESP32 compile
    - tests/test_firmware_can_core.py
    - tests/test_firmware_serial_transport.py
    evidence:
    - docs/contracts-v1.md
    - S01 contract-test run
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    status: partial
    limitation: S03 adds a compile-verified firmware receive/core and schema-v1 serial
      telemetry; browser UI, durable persistence, signal discovery and simulator remain
      unimplemented.
  REQ-HW-001:
    implementation:
    - project/hardware.yaml
    - project/environment.yaml
    - firmware/esp32/main/Kconfig.projbuild
    - hardware/reference/esp32-tja1051t3-netlist.yaml
    - hardware/reference/safety-interlock.md
    - firmware/esp32/main/civic_safety.c
    tests:
    - tests/test_firmware_source.py::FirmwareSourceGuardTests.test_pin_configuration_defaults_to_unassigned
    - tests/test_firmware_source.py::FirmwareSourceGuardTests.test_runtime_gpio_guard_rejects_flash_and_strapping_pins
    - PlatformIO original-ESP32 compile
    evidence:
    - docs/reports/S00-environment-report.md
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    - hardware/reference/safety-interlock.md
    status: partial
    limitation: GPIO and TX gates are guarded at source level; physical board pinout,
      assembled interlock and native Proteus artifact are not validated.
  REQ-CAN-001:
    implementation:
    - schemas/v1/can-frame.schema.json
    - src/civic_workbench/contracts.py
    - firmware/esp32/main/civic_can.c
    - firmware/esp32/main/civic_can.h
    - firmware/esp32/main/app_main.c
    tests:
    - tests/test_contracts.py::CanFrameContractTests
    - PlatformIO original-ESP32 compile
    - tests/test_firmware_source.py::FirmwareSourceGuardTests.test_s02_driver_is_listen_only_and_has_no_tx_call
    - tests/test_firmware_can_core.py::FirmwareCanCoreMockTests.test_production_can_core_with_mock_twai_and_freertos
    - tests/test_firmware_source.py::FirmwareSourceGuardTests.test_rx_ingress_is_bounded_and_exports_loss_counters
    evidence:
    - docs/contracts-v1.md
    - S01 contract-test run
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    status: partial
    limitation: The production receive core is mock-tested for valid/invalid frames,
      bounded queues, drop counters, diagnostics and bus-off recovery; no physical
      CAN bus or real ESP32 controller has been exercised.
  REQ-CAN-002:
    implementation:
    - schemas/v1/capture-session.schema.json
    - firmware/esp32/main/civic_transport.c
    - firmware/esp32/main/civic_transport_format.c
    - docs/protocol/firmware-serial-v1.md
    tests:
    - tests/test_contracts.py::SessionAndFindingContractTests
    - tests/test_firmware_transport.py
    - tests/test_firmware_serial_transport.py
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S03-can-transport-report.md
    - docs/protocol/firmware-serial-v1.md
    status: partial
    limitation: Raw frame/status serialization and serial record shapes are schema-tested.
      Durable raw-session storage, import/export, reconnect handling and production
      host bridge are not implemented.
  REQ-CAN-003:
    implementation:
    - schemas/v1/tx-request.schema.json
    - schemas/v1/safety-state.schema.json
    - src/civic_workbench/contracts.py::authorize_transmission
    - firmware/esp32/main/civic_safety_policy.c
    - firmware/esp32/main/civic_safety.c
    - firmware/esp32/main/Kconfig.projbuild
    - firmware/esp32/main/civic_can.c::civic_can_transmit_guarded
    tests:
    - tests/test_contracts.py::DiagnosticAndSafetyContractTests
    - tests/firmware/test_safety_policy.c
    - tests/test_firmware_source.py
    - tests/test_firmware_can_core.py::FirmwareCanCoreMockTests.test_production_can_core_with_mock_twai_and_freertos
    - tests/test_firmware_source.py::FirmwareSourceGuardTests.test_default_mode_is_passive_and_tx_uses_one_guarded_api
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    status: partial
    limitation: A guarded single-frame C API exists and is mock-tested, with TX disabled
      by default and no serial command endpoint. Physical transmission, scheduling/repeats,
      persistent TX audit and vehicle safety remain unverified.
  REQ-REV-001:
    implementation:
    - schemas/v1/analysis-finding.schema.json
    tests:
    - tests/test_contracts.py::SessionAndFindingContractTests
    evidence:
    - docs/contracts-v1.md
    status: partial
    limitation: Finding/evidence shape is defined; discovery algorithms are not implemented.
  REQ-DATA-001:
    implementation:
    - schemas/v1/capture-session.schema.json
    - schemas/v1/can-frame.schema.json
    tests:
    - tests/test_contracts.py::JsonSchemaTests
    evidence:
    - docs/contracts-v1.md
    status: partial
    limitation: Versioned storage contract is defined; durable persistence, migration
      and import/export implementation remain open.
  REQ-UI-001:
    implementation: []
    tests: []
    evidence: []
    status: open
    limitation: Browser UI not started.
  REQ-SIM-001:
    implementation: []
    tests: []
    evidence: []
    status: open
    limitation: Virtual CAN bus and scenario runner not started.
  REQ-DIAG-001:
    implementation:
    - schemas/v1/diagnostic-capability.schema.json
    - src/civic_workbench/contracts.py
    tests:
    - tests/test_contracts.py::DiagnosticAndSafetyContractTests
    evidence:
    - docs/contracts-v1.md
    status: partial
    limitation: Capability/evidence model is implemented; no target-specific diagnostic
      capability is asserted or enabled.
  REQ-PROT-001:
    implementation: []
    tests: []
    evidence:
    - docs/reports/S00-environment-report.md
    status: open
    limitation: Python generator and native Proteus project remain for S09; native
      generation route is not yet verified.
  REQ-SAFE-001:
    implementation:
    - schemas/v1/safety-state.schema.json
    - src/civic_workbench/contracts.py::authorize_transmission
    - firmware/esp32/main/civic_safety.c
    - firmware/esp32/main/civic_safety_policy.c
    - hardware/reference/safety-interlock.md
    - firmware/esp32/main/civic_can.c
    tests:
    - tests/test_contracts.py::DiagnosticAndSafetyContractTests
    - tests/firmware/test_safety_policy.c
    - tests/test_firmware_source.py
    - tests/test_firmware_can_core.py
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    - hardware/reference/safety-interlock.md
    status: partial
    limitation: Software policy, fail-closed defaults, and host-mock disarm paths
      pass tests. The independent physical interlock, transceiver Silent bias, and
      failure modes have not been bench-tested.
  REQ-EVID-001:
    implementation:
    - tests/requirements-traceability.yaml
    - project/progress.json
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    tests:
    - tests/test_contracts.py::ApiAndTraceabilityTests::test_requirement_traceability_covers_all_declared_requirements
    - tests/test_contracts.py::ApiAndTraceabilityTests.test_requirement_traceability_covers_all_declared_requirements
    - tests/test_contracts.py::ApiAndTraceabilityTests.test_progress_ledger_records_verified_stage_state
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    status: partial
    limitation: S00-S03 source/build/host-mock evidence is recorded. UI, persistence,
      analysis, simulator, Proteus, real-bus, and vehicle evidence remains open until
      corresponding stages.
  REQ-QUAL-001:
    implementation:
    - requirements.txt
    - requirements-dev.txt
    - Makefile
    - tests/test_contracts.py
    - firmware/esp32/platformio.ini
    - firmware/esp32/sdkconfig.defaults
    - tools/requirements-platformio.txt
    - tests/test_firmware_source.py
    - tests/firmware/test_safety_policy.c
    - firmware/esp32/main/
    - tests/test_firmware_can_core.py
    - tests/test_firmware_serial_transport.py
    - tests/test_firmware_transport.py
    tests:
    - PYTHONPATH=src python3 -m unittest discover -s tests -v
    - git diff --check
    - make test
    - python3 -m compileall -q src tests
    - cd firmware/esp32 && ~/.venvs/civic-workbench-pio/bin/pio run
    evidence:
    - docs/reports/S01-contract-report.md
    - docs/reports/S02-firmware-report.md
    - docs/reports/S03-can-transport-report.md
    status: partial
    limitation: Host contracts, mock integration, serializer/schema checks and target
      compilation pass. CI gate integration, throughput/latency qualification, real
      serial-link testing and physical bench/vehicle validation remain outstanding.
  REQ-TOK-001:
    implementation:
    - CLAUDE.md
    - docs/staged-delivery.md
    - project/dependencies.yaml
    tests:
    - tests/test_contracts.py::ApiAndTraceabilityTests
    evidence:
    - docs/contracts-v1.md
    - docs/reports/S01-contract-report.md
    status: partial
    limitation: Stage IDs, on-demand contracts and persistent evidence reduce repeated
      context; no token-cost benchmark is claimed.
rules:
- Use repository-relative paths and stable test identifiers for every implementation/evidence
  reference.
- Set status to verified only when evidence exists and the full requirement acceptance
  criteria pass.
- Partial means a specific subset is implemented and tested; it does not mean the
  requirement is complete.
- Simulation evidence must not be labeled hardware_bench or vehicle evidence.
- Any exception requires a reason, risk, approving person, and expiry/revisit condition.
