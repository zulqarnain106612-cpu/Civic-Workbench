    - tests/test_api_security.py
    - tests/test_packaging.py
    evidence:
    - docs/reports/S04-browser-ui-report.md
    status: host-UI-and-API-integration-verified;visual-certification-pending
    limitation: Local static UI/API behavior is covered by integration and security
      tests. Cross-browser visual/accessibility certification and connected-hardware
      UI testing were not performed.
  REQ-SIM-001:
    implementation:
    - src/civic_workbench/simulator.py
    - src/civic_workbench/service.py
    - src/civic_workbench/web/index.html
    - src/civic_workbench/web/app.js
    tests:
    - tests/test_simulator_tx.py
    - tests/test_api_integration.py
    evidence:
    - docs/reports/S08-simulator-report.md
    status: simulation-integration-tests-passed
    limitation: Deterministic simulator scheduling, replay, mutation, source labelling,
      queue limits and simulator-only TX pass tests. This does not model electrical
      bus/ECU behavior.
  REQ-DIAG-001:
    implementation:
    - schemas/v1/diagnostic-capability.schema.json
    - src/civic_workbench/contracts.py
    - src/civic_workbench/diagnostics.py
    - src/civic_workbench/service.py
    - src/civic_workbench/storage.py
    - src/civic_workbench/web/app.js
